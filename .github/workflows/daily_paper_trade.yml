name: Daily Taiwan Stock Paper Trading

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-paper-trading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python daily_runner.py
      - name: Commit updated SQLite ledger
        run: |
          git config user.name "QuantCompassBot"
          git config user.email "bot@quantcompass.local"
          git add quant_compass_v2_ledger.db
          git diff --staged --quiet || git commit -m "chore: daily paper trade update"
          git push
